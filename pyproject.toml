[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-analytics-copilot"
version = "0.2.0"
description = "Deterministic analytics over explicitly synthetic academic records"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.11,<3",
  "pandas>=2.2,<4",
  "openpyxl>=3.1.5,<4",
  "defusedxml>=0.7.1,<1",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<10"]

[project.scripts]
academic-demo = "copilot.data.generate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
copilot = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
